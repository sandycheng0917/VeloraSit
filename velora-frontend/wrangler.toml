# ══════════════════════════════════════════════════════════════════
#  Cloudflare Worker：靜態站台 + D1 讀取 API
#
#  🔴 這是 Worker 的設定，不是 Pages 的。
#     velorasit 在 Cloudflare 上是一個 Worker（Pages 專案清單是空的）。
#     2026-09-28 之前這裡寫的是 Pages 形狀 —— pages_build_output_dir 這個鍵、
#     還有 functions/api/*.js 那套資料夾慣例，Worker 兩者都不認得。
#     不要因為「Cloudflare 的設定檔看起來都長這樣」就把它們加回來。
#
#  🔴 name 必須等於 Cloudflare 上的 Worker 名稱，否則部署會被拒絕。
#     改名的時候 package.json 的 cf:deploy 也要一起改 ——
#     2026-09-28 之前這兩處加上 dashboard 寫了三種名字，部署一直失敗。
# ══════════════════════════════════════════════════════════════════
name = "velorasit"
main = "worker/index.js"
compatibility_date = "2024-09-01"

[vars]
APP_NAME = "velora"

# ── 靜態資源 ────────────────────────────────────────────────────────
# directory 是 vite build 的產物。公開站在根目錄，後台在 dist/admin/。
#
# 🔴 not_found_handling 維持預設的 "none"，不要設成 "single-page-application"。
#    設了的話靜態層會在找不到檔案時直接回 index.html，/api/* 也一樣 ——
#    Worker 永遠不會被執行，前端拿到 200 加一份 HTML，然後在 JSON.parse
#    才炸開，錯誤訊息會指向完全無關的地方。
#    SPA 的 fallback 由 worker/index.js 自己做，那裡分得出 /api/。
[assets]
directory = "./dist"
binding = "ASSETS"

# ── D1 ──────────────────────────────────────────────────────────────
# 套用 schema：
#   npx wrangler d1 migrations apply veloradb_sit --remote
# 灌資料：
#   node ../tools/d1-seed.mjs
#   npx wrangler d1 execute veloradb_sit --remote --file ../build/d1-seed.sql
[[d1_databases]]
binding = "DB"
database_name = "veloradb_sit"
database_id = "2726836e-da8e-4535-ac15-74e8855d2277"
migrations_dir = "migrations"
